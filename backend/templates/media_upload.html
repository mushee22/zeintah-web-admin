
{% extends 'base.html' %}
{% load static %}
{% block extra_css %}
<style>
    .upload-container {
        max-width: 800px;
        margin: 50px auto;
        padding: 30px;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .upload-area {
        border: 3px dashed #ddd;
        border-radius: 10px;
        padding: 40px;
        text-align: center;
        margin-bottom: 20px;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .upload-area:hover {
        border-color: #007bff;
        background-color: #f8f9fa;
    }

    .upload-area.dragover {
        border-color: #007bff;
        background-color: #e3f2fd;
    }

    .upload-icon {
        font-size: 48px;
        color: #6c757d;
        margin-bottom: 15px;
    }

    .file-input {
        display: none;
    }

    .upload-btn {
        background: #007bff;
        color: white;
        border: none;
        padding: 12px 30px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.3s ease;
    }

    .upload-btn:hover {
        background: #0056b3;
    }

    .upload-btn:disabled {
        background: #6c757d;
        cursor: not-allowed;
    }

    .progress-container {
        display: none;
        margin-top: 20px;
    }

    .progress-bar {
        width: 100%;
        height: 20px;
        background-color: #e9ecef;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 10px;
    }

    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #007bff, #0056b3);
        width: 0%;
        transition: width 0.3s ease;
    }

    .progress-text {
        text-align: center;
        color: #6c757d;
        font-size: 14px;
    }

    .uploaded-files {
        margin-top: 30px;
    }

    .file-item {
        display: flex;
        align-items: center;
        padding: 15px;
        border: 1px solid #e9ecef;
        border-radius: 5px;
        margin-bottom: 10px;
        background: #f8f9fa;
    }

    .file-info {
        flex: 1;
        margin-left: 15px;
    }

    .file-name {
        font-weight: bold;
        margin-bottom: 5px;
    }

    .file-size {
        color: #6c757d;
        font-size: 12px;
    }

    .file-url {
        color: #007bff;
        text-decoration: none;
        font-size: 12px;
    }

    .file-url:hover {
        text-decoration: underline;
    }

    .alert {
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 5px;
    }

    .alert-success {
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
    }

    .alert-error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #495057;
    }

    .form-control {
        width: 100%;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 5px;
        font-size: 14px;
    }

    .form-control:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }
</style>
{% endblock %}
{% block content %}

<div class="content">

    {% include 'navbar.html' %}

    <div class="main-container">
        <div class="bread-crumb-container">
            <a href="{% url 'sub_chapter_list' %}"><span class="parent">Sub Chapter</span></a>><span>Create</span>
        </div>
        <div class="upload-container">
            <h2 class="text-center mb-4">Video Upload</h2>
            
            <div id="alert-container"></div>
            
            <form id="upload-form">
                <div class="form-group">
                    <label for="title" class="form-label">Video Title</label>
                    <input type="text" id="title" name="title" class="form-control" placeholder="Enter video title" required>
                </div>
                
                <div class="upload-area" id="upload-area">
                    <div class="upload-icon">📁</div>
                    <h4>Drag & Drop your video here</h4>
                    <p>or</p>
                    <button type="button" class="upload-btn" id="browse-btn">Browse Files</button>
                    <input type="file" id="file-input" class="file-input" accept="video/*" required>
                </div>
                
                <div class="progress-container" id="progress-container">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="progress-text" id="progress-text">0%</div>
                </div>
                
                <button type="submit" class="upload-btn" id="submit-btn" disabled>Upload Video</button>
            </form>
            
            <div class="uploaded-files" id="uploaded-files">
                <h3>Uploaded Videos</h3>
                <div id="files-list"></div>
            </div>
        </div>
    </div>
</div>

<div id="loading-overlay" style="display: none;">
  <div class="loader-container">
    <div class="spinner"></div>
    <p>Uploading, please wait...</p>
  </div>
</div>

{% endblock %}

{% block script %}
<script src="{% static 'js/showSelectedImage.js' %}"></script>
<script src="{% static 'js/validationMessageGenerator.js' %}"></script>
<script src="{% static 'js/media-upload.js' %}"></script>

{% endblock %}
