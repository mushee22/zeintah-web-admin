{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content">

    {% include 'navbar.html' %}

    <div class="main-container">
        <div class="bread-crumb-container">
            <a href="{% url 'category_list' %}"><span class="parent">Category</span></a>><span>Create</span>
        </div>
        <form method="POST" action="{% url 'create_category' %}" id="CreateFormId" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <div class="form-label required">Icon</div>
                <label for="ImageField" class="image-box" style="background-image: url(/static/images/default-image.jpg);/"></label>
                <input type="file" id="ImageField" name="icon" style="
                            opacity: 0;
                            width: 0;
                            height: 0;
                            position: absolute;
                            z-index: -1;
                ">
            </div>
            <div class="mb-3">
                <label for="name" class="form-label required">Name</label>
                <input type="text" class="form-control" id="name" name="name">
            </div>
            <div class="mb-3">
                <label for="order" class="form-label required">Order</label>
                <input type="number" class="form-control" id="order" name="order"></textarea>
            </div>
            <a href="{% url 'batch_list' %}"><button type="button" class="btn btn-secondary">Cancel</button></a>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>

{% endblock %}

{% block script %}
<script src="{% static 'js/showSelectedImage.js' %}"></script>
<script src="{% static 'js/validationMessageGenerator.js' %}"></script>
<script>
   $(document).ready(function () {
    $("#CreateFormId").validate({
      rules: {
        name: {
          required: true
        },
        code: {
          required: true
        },
      },
      messages: {
        name: "Please enter a catgory name",
        code: "Please enter order",
      },
      errorClass: "text-danger",
      errorElement: "small",
      highlight: function (element) {
        $(element).addClass("is-invalid");
      },
      unhighlight: function (element) {
        $(element).removeClass("is-invalid");
      },
      submitHandler: function (form) {
        form.submit();
      }
    });
  });
</script>
{% endblock %}
