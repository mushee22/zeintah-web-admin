{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content">

    {% include 'navbar.html' %}

    <div class="main-container">
        <div class="bread-crumb-container">
            <a href="{% url 'idea_list' %}"><span class="parent">Course</span></a>><span>Create</span>
        </div>
        <form method="POST" action="{% url 'create_idea' %}" enctype="multipart/form-data" id="CreateFormId">
            {% csrf_token %}
            <div class="mb-3">
                <div class="form-label">Image (Optional)</div>
                <label for="ImageField" class="image-box" style="background-image: url(/static/images/default-image.jpg);/"></label>
                <input type="file" id="ImageField" name="thumbnail" style="opacity: 0; width: 0; height: 0; position: absolute; z-index: -1;">
                <small class="form-text text-muted">Supported formats: JPG, JPEG, PNG. Maximum size: 3MB</small>
            </div>
            <div class="mb-3">
                <label for="title" class="form-label required">Title</label>
                <input type="text" class="form-control" id="title" name="title">
            </div>
            <!-- <div class="mb-3">
                <label for="chapter" class="form-label required">Category</label>
                <select class="form-control" name="category_id" id="chapter">
                    <option value="">--select a Category--</option>
                    {% for item in categories %}
                    <option value="{{item.id}}">{{item.name}}</option>
                    {% endfor %}
                </select>
            </div> -->
            <div class="mb-3">
                <label for="description" class="form-label required">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4"></textarea>
            </div> 
            <a href="{% url 'chapter_list' %}"><button type="button" class="btn btn-secondary">Cancel</button></a>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>

{% endblock %}

{% block script %}
<script src="{% static 'js/showSelectedImage.js' %}"></script>
<script src="{% static 'js/validationMessageGenerator.js' %}"></script>
<script>
    $(document).ready(function () {
    
    // Custom method: check if file is an image (only when file is selected)
    $.validator.addMethod("imageOnly", function (value, element) {
      if (element.files.length === 0) return true; // Optional field, no file is OK
      const fileType = element.files[0].type;
      return /^(image\/jpeg|image\/png|image\/jpg|image)$/i.test(fileType);
    }, "Only image files are allowed (jpg, jpeg, png)");

    // Custom method: check file size <= 3MB (only when file is selected)
    $.validator.addMethod("maxFileSize", function (value, element, param) {
      if (element.files.length === 0) return true; // Optional field, no file is OK
      return element.files[0].size <= param;
    }, "Image must be less than 3MB");

    $("#CreateFormId").validate({
      rules: {
        thumbnail: {
          imageOnly: true,
          maxFileSize: 3145728 // 3MB in bytes
        },
        // title: {
        //   required: true
        // },
        description: {
          required: true
        },
      },
      messages: {
        title: "Please enter a idea title",
        description: "Please enter the description",
        // category_id: "Please select a category"
      },
      errorClass: "text-danger",
      errorElement: "small",
      highlight: function (element) {
        $(element).addClass("is-invalid");
      },
      unhighlight: function (element) {
        $(element).removeClass("is-invalid");
      },
      submitHandler: function (form) {
        form.submit();
      }
    });
  });
</script>
{% endblock %}
