{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="content">

    {% include 'navbar.html' %}

    <div class="main-container">
        <div class="bread-crumb-container">
            <a href="{% url 'idea_list' %}"><span class="parent">Course</span></a>><span>Update</span>
        </div>
        <form method="POST" action="{% url 'update_idea' pk=context_data.id %}" enctype="multipart/form-data" id="CreateFormId">
            {% csrf_token %}
            {% if context_data.thumbnail %}
            <div class="mb-3">
                <label for="title" class="form-label required">Current Thumbnail</label>
                <td>
                    <img class="flex-shrink-0" src="{{context_data.thumbnail.url}}" alt=""
                    style="width: 40px; height: 40px;">
                </td>
            </div>
            {% else %}
            <td><img class="flex-shrink-0" src="{% static 'images/default-image.jpg' %}" alt=""
                    style="width: 40px; height: 40px;"></td>
            {% endif %}
            <div class="mb-3">
                <div class="form-label required">thumbnail</div>
                <label for="ImageField" class="image-box" style="background-image: url(/static/images/default-image.jpg);/"></label>
                <input type="file" id="ImageField" name="thumbnail" style="
                            opacity: 0;
                            width: 0;
                            height: 0;
                            position: absolute;
                            z-index: -1;">
            </div>
            <div class="mb-3">
                <label for="title" class="form-label required">Title</label>
                <input type="text" value="{{context_data.title}}" class="form-control" id="title" name="title">
            </div>
            <div class="mb-3">
                <label for="chapter" class="form-label required">Category</label>
                <select class="form-control" name="category_id" id="chapter">
                    <option value="">--select a Category--</option>
                    {% for item in categories %}
                    <option value="{{item.id}}" {% if context_data.category.id == item.id %}selected{% endif %}>{{item.name}}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="description" class="form-label required">Description</label>
                <textarea class="form-control" value="{{ context_data.description }}" id="description" name="description" rows="4">{{context_data.description}}</textarea>
            </div> 
            <a href="{% url 'idea_list' %}"><button type="button" class="btn btn-secondary">Cancel</button></a>
            <button type="submit" class="btn btn-primary">Save</button>
        </form>
    </div>
</div>

{% endblock %}

{% block script %}
<script src="{% static 'js/showSelectedImage.js' %}"></script>
<script src="{% static 'js/validationMessageGenerator.js' %}"></script>
<script>
    $(document).ready(function () {
    
    $.validator.addMethod("requiredFile", function (value, element) {
      return element.files && element.files.length > 0;
    }, "Please select an image");    

    $.validator.addMethod("imageOnly", function (value, element) {
      if (element.files.length === 0) return false;
      const fileType = element.files[0].type;
      return /^(image\/jpeg|image\/png|image\/jpg|image)$/i.test(fileType);
    }, "Only image files are allowed (jpg, jpeg, png)");

    // Custom method: check file size <= 3MB
    $.validator.addMethod("maxFileSize", function (value, element, param) {
      if (element.files.length === 0) return false;
      return element.files[0].size <= param;
    }, "Image must be less than 3MB");

    $("#CreateFormId").validate({
      rules: {
        description: {
          required: true
        },
        
      },
      messages: {
        thumbnail: {
          required: "Please select an image"
        },
        title: "Please enter a idea title",
        description: "Please enter the description",
        category_id: "Please select a category"
      },
      errorClass: "text-danger",
      errorElement: "small",
      highlight: function (element) {
        $(element).addClass("is-invalid");
      },
      unhighlight: function (element) {
        $(element).removeClass("is-invalid");
      },
      submitHandler: function (form) {
        form.submit();
      }
    });
  });
</script>
{% endblock %}
